name: Fork validation - Docker Hub publish, sign and native smoke tests

on:
  push:
    branches: [CNAPP-33972-validation]

permissions:
  contents: read

env:
  TEST_IMAGE: sanskardevops/kubearmor-relay-server

concurrency:
  group: relay-fork-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry-access:
    name: Check Docker Hub credential is configured
    if: github.repository == 'Sanskarzz/kubearmor-relay-server'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Docker Hub write credential
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_AUTHTOK }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add DOCKER_AUTHTOK to the fork's Actions secrets, then rerun this workflow."
            exit 1
          fi
  build-native:
    name: Build native ${{ matrix.arch }} image
    if: github.repository == 'Sanskarzz/kubearmor-relay-server'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Build native image and export cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly
          build-args: BUILDKIT_MULTI_PLATFORM=1
          cache-from: type=gha,scope=relay-${{ matrix.arch }}
          cache-to: type=gha,scope=relay-${{ matrix.arch }},mode=max

  push-docker-img:
    name: Assemble multi-platform image
    needs: [build-native, registry-access]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.tag.outputs.tag }}
    env:
      PUBLISH: ${{ github.repository == 'Sanskarzz/kubearmor-relay-server' && github.event_name == 'push' && github.ref == 'refs/heads/CNAPP-33972-validation' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx with command execution disabled
        uses: docker/setup-buildx-action@v3
        with:
          # Keep this list consistent with relay-server/build/push_img.sh.
          platforms: linux/amd64,linux/arm64/v8
          # Cache imports still work, but any uncached RUN fails through /bin/false.
          # Disabling QEMU alone is insufficient: BuildKit includes emulators.
          buildkitd-flags: >-
            --oci-worker=true
            --oci-worker-binary=/bin/false
            --containerd-worker=false
            --oci-worker-platform=linux/amd64
            --oci-worker-platform=linux/arm64/v8

      - name: Verify that an uncached RUN is rejected
        run: |
          context=$(mktemp -d)
          trap 'rm -rf "$context"' EXIT
          cat > "$context/Dockerfile" <<'EOF'
          FROM redhat/ubi10-minimal
          RUN true
          EOF
          if docker buildx build --no-cache --progress=plain --platform linux/amd64 "$context"; then
            echo "::error::Cache-only builder executed an uncached RUN"
            exit 1
          fi

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: sanskardevops
          password: ${{ secrets.DOCKER_AUTHTOK }}

      - name: Get image tag
        id: tag
        run: |
          TAG=cnapp33972-${GITHUB_SHA:0:12}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Assemble image from native caches
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay-server/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: ${{ env.PUBLISH == 'true' }}
          outputs: ${{ env.PUBLISH != 'true' && format('type=oci,dest={0}/relay-image.tar', runner.temp) || '' }}
          tags: ${{ env.TEST_IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            BUILDKIT_MULTI_PLATFORM=1
            VERSION=${{ steps.tag.outputs.tag }}
          cache-from: |
            type=gha,scope=relay-amd64
            type=gha,scope=relay-arm64

  sign-image:
    name: Sign published image
    needs: push-docker-img
    if: github.repository == 'Sanskarzz/kubearmor-relay-server' && github.event_name == 'push' && github.ref == 'refs/heads/CNAPP-33972-validation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sanskardevops
          password: ${{ secrets.DOCKER_AUTHTOK }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign the Container Images
        env:
          IMAGE_DIGEST: ${{ needs.push-docker-img.outputs.digest }}
        run: |
          cosign sign -r "$TEST_IMAGE@$IMAGE_DIGEST" --yes

      - name: Verify published architectures and signature
        env:
          IMAGE_DIGEST: ${{ needs.push-docker-img.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$TEST_IMAGE@$IMAGE_DIGEST" > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          cosign verify "$TEST_IMAGE@$IMAGE_DIGEST" \
            --certificate-identity "https://github.com/Sanskarzz/kubearmor-relay-server/.github/workflows/ci-latest-release.yml@refs/heads/CNAPP-33972-validation" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > signatures.json
          cat manifest.json
          cat signatures.json
          echo "Published and verified: $TEST_IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Save manifest and signature verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockerhub-manifest-and-signature-evidence
          path: |
            manifest.json
            signatures.json
          if-no-files-found: warn
          retention-days: 30

  verify-native:
    name: Pull and smoke test published ${{ matrix.arch }} image
    needs: [push-docker-img, sign-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      IMAGE_DIGEST: ${{ needs.push-docker-img.outputs.digest }}
      IMAGE_VERSION: ${{ needs.push-docker-img.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sanskardevops
          password: ${{ secrets.DOCKER_AUTHTOK }}

      - name: Pull exact digest and validate image configuration
        run: |
          ref="$TEST_IMAGE@$IMAGE_DIGEST"
          docker pull --platform "$PLATFORM" "$ref"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect "$ref" --format '{{.Config.User}}')" = default
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "version"}}')" = "$IMAGE_VERSION"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "release"}}')" = "$IMAGE_VERSION"
          docker run --rm --platform "$PLATFORM" --entrypoint /bin/sh "$ref" -ec '
            test "$(id -u)" = 1000
            . /etc/os-release
            test "$ID" = rhel
            case "$VERSION_ID" in 10|10.*) ;; *) exit 1 ;; esac
            /KubeArmor/kubearmor-relay-server --help
          '

      - name: Smoke test relay startup on its native architecture
        run: |
          ref="$TEST_IMAGE@$IMAGE_DIGEST"
          trap 'docker logs relay-smoke; docker rm -f relay-smoke >/dev/null' EXIT
          docker run --detach --name relay-smoke --platform "$PLATFORM" \
            -p 127.0.0.1:32767:32767 "$ref"
          for attempt in $(seq 1 30); do
            test "$(docker inspect --format '{{.State.Running}}' relay-smoke)" = true
            if docker logs relay-smoke 2>&1 | grep -q 'Started to serve gRPC-based log feeds'; then
              break
            fi
            sleep 1
          done
          docker logs relay-smoke 2>&1 | grep 'Started to serve gRPC-based log feeds'
          python3 - <<'CHECK'
          import socket
          with socket.create_connection(("127.0.0.1", 32767), timeout=5):
              print("Relay TCP listener is reachable")
          CHECK
          echo "Validated native $ARCH: UBI10, version labels, UID 1000, executable startup and listening socket" >> "$GITHUB_STEP_SUMMARY"
